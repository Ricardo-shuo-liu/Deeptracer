name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 稳定的后端 CI。
  # 即使未来 UI 从服务端模板演进为独立前端应用，这里也应继续作为主要质量门禁。
  backend:
    name: Backend (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check deeptracer tests

      - name: Check formatting with Ruff
        run: python -m ruff format --check deeptracer tests

      - name: Run pytest
        env:
          CI: true
        run: |
          mkdir -p reports
          python -m pytest tests -q --maxfail=1 \
            --junitxml=reports/junit-python-3.10.xml \
            --cov=deeptracer \
            --cov-report=xml:reports/coverage-python-3.10.xml

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-python-3.10
          path: reports/**

  # 当前前端检查面向服务端模板和静态 JS/CSS 资源。
  # 如果项目后续采用独立前端应用（例如在 frontend/ 目录中使用 React/Vue），
  # 可将这个 job 替换为标准 Node 前端流水线：
  # npm ci -> npm run lint -> npm run build -> npm test
  frontend-assets:
    name: Frontend Assets
    runs-on: ubuntu-latest
    if: ${{ hashFiles('deeptracer/templates/**/*.html', 'deeptracer/static/js/**/*.js', 'deeptracer/static/css/**/*.css') != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify template asset references
        run: |
          test -f deeptracer/templates/index.html
          test -f deeptracer/static/css/main.css
          test -f deeptracer/static/js/main.js
          grep -q '/static/css/main.css' deeptracer/templates/index.html
          grep -q 'src="/static/js/main.js"' deeptracer/templates/index.html

      - name: Validate JavaScript syntax
        run: |
          find deeptracer/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
